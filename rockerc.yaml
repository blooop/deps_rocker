# This file describes the docker image and rocker extensions to load
# Rockerc configuration: https://github.com/blooop/rockerc
#
# Key components:
# - image: Specifies the base image to pass to rocker
# - args: Lists additional features or tools to be added to the docker image
# - defaults: Optional default values for extension-specific arguments

image: ubuntu:22.04
args:
  - jquery
  - x11
  - user
  - pull
  - git
  - cwd
  - pixi
  - uv

# Optional: Configure extension-specific defaults
# defaults:
#   # Pixi runtime mode (faster dev iteration with persistent cache)
#   # Requires: docker run -v pixi-cache:/opt/pixi ...
#   pixi_runtime_mode: false  # Default: false (build-time mode)
